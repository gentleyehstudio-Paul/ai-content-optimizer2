<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Experience the world through the eyes of different animals using WebGL 2.0" />
  <title>🐾 Animal Vision WebGL Simulator</title>

  <style>
    :root {
      --primary-color: #6366f1;
      --secondary-color: #ec4899;
      --success-color: #10b981;
      --warning-color: #f59e0b;
      --danger-color: #ef4444;
      --dark-bg: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.2);
      --transition: all 0.3s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body, #root {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--dark-bg);
      color: var(--text-primary);
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }

    .app-header {
      padding: 1.5rem;
      background: linear-gradient(90deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow-md);
      z-index: 10;
    }

    .app-header h1 {
      font-size: 1.875rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      background: linear-gradient(90deg, #6366f1, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .app-header p {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .app-main {
      display: flex;
      flex: 1;
      gap: 1rem;
      padding: 1rem;
      overflow: hidden;
      min-height: 0;
    }

    .canvas-wrapper {
      flex: 1;
      display: flex;
      position: relative;
      border-radius: 0.75rem;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      background: #000;
    }

    .error-banner {
      position: absolute;
      top: 1rem;
      left: 1rem;
      right: 1rem;
      background: var(--danger-color);
      color: white;
      padding: 1rem;
      border-radius: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      animation: slideIn 0.3s ease;
      box-shadow: var(--shadow-md);
    }

    @keyframes slideIn {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .error-banner button {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      font-size: 1.25rem;
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      transition: var(--transition);
    }

    .error-banner button:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .video-element {
      display: none;
    }

    .webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
      user-select: none;
      cursor: default;
    }

    .controls-sidebar {
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
      max-height: 100%;
    }

    .controls-sidebar::-webkit-scrollbar {
      width: 6px;
    }

    .controls-sidebar::-webkit-scrollbar-track {
      background: var(--card-bg);
    }

    .controls-sidebar::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    .controls-sidebar::-webkit-scrollbar-thumb:hover {
      background: var(--primary-color);
    }

    .performance-monitor {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.05), rgba(236, 72, 153, 0.05));
      border: 1px solid var(--border-color);
      border-radius: 0.75rem;
      padding: 1.25rem;
      box-shadow: var(--shadow-md);
      font-size: 0.875rem;
    }

    .monitor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .monitor-header h3 {
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary-color);
      margin: 0;
    }

    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    .status-indicator.good {
      background: var(--success-color);
      box-shadow: 0 0 8px var(--success-color);
    }

    .status-indicator.fair {
      background: var(--warning-color);
      box-shadow: 0 0 8px var(--warning-color);
    }

    .status-indicator.poor {
      background: var(--danger-color);
      box-shadow: 0 0 8px var(--danger-color);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .monitor-stats {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
    }

    .stat-label {
      font-size: 0.813rem;
      color: var(--text-secondary);
      font-weight: 500;
      text-transform: uppercase;
    }

    .stat-value {
      font-family: 'Monaco', 'Courier New', monospace;
      font-weight: 700;
      font-size: 0.875rem;
      color: var(--text-primary);
      min-width: 3rem;
      text-align: right;
    }

    .fps-value {
      color: var(--primary-color);
      font-size: 1rem;
    }

    .mode-badge {
      background: var(--primary-color);
      color: white;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .target-info {
      margin-bottom: 1rem;
      padding: 0.75rem;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 0.5rem;
    }

    .target-info p {
      margin: 0 0 0.5rem 0;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .performance-bar {
      width: 100%;
      height: 6px;
      background: rgba(99, 102, 241, 0.2);
      border-radius: 3px;
      overflow: hidden;
    }

    .performance-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--success-color), var(--primary-color));
      border-radius: 3px;
      transition: width 0.3s ease;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
    }

    .control-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 0.75rem;
      padding: 1.5rem;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .panel-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panel-section h3 {
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary-color);
      margin: 0;
    }

    .mode-buttons {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .mode-button {
      padding: 0.75rem;
      background: rgba(99, 102, 241, 0.1);
      border: 2px solid transparent;
      border-radius: 0.5rem;
      color: var(--text-primary);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      text-align: left;
    }

    .mode-button:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--primary-color);
    }

    .mode-button.active {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
    }

    .toggle-button {
      padding: 0.875rem 1rem;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 2px solid var(--border-color);
      border-radius: 0.5rem;
      color: var(--text-primary);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .toggle-button:hover {
      background: linear-gradient(135deg, #334155, #1e293b);
      border-color: var(--primary-color);
    }

    .toggle-button.active {
      background: linear-gradient(135deg, var(--success-color), var(--primary-color));
      border-color: var(--success-color);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
    }

    .parameters {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .parameter-control {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .parameter-label {
      font-size: 0.813rem;
      font-weight: 500;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .parameter-input-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .parameter-slider {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    .parameter-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--primary-color);
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
      border: 2px solid var(--dark-bg);
    }

    .parameter-slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--primary-color);
      cursor: pointer;
      border: 2px solid var(--dark-bg);
    }

    .parameter-value {
      min-width: 2.5rem;
      text-align: right;
      font-size: 0.813rem;
      font-weight: 600;
      color: var(--primary-color);
      font-family: 'Monaco', monospace;
    }

    .info-section {
      margin-top: auto;
      padding-top: 1rem;
      border-top: 1px solid var(--border-color);
      background: rgba(99, 102, 241, 0.05);
      padding: 1rem;
      border-radius: 0.5rem;
    }

    .info-section h3 {
      margin-bottom: 0.75rem;
      font-size: 0.813rem;
    }

    .mode-description {
      font-size: 0.75rem;
      line-height: 1.5;
      color: var(--text-secondary);
      margin: 0;
    }

    .app-footer {
      padding: 1rem;
      background: linear-gradient(90deg, #1e293b 0%, #0f172a 100%);
      border-top: 1px solid var(--border-color);
      text-align: center;
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    @media (max-width: 1024px) {
      .app-main {
        flex-direction: column;
      }

      .controls-sidebar {
        width: 100%;
        height: auto;
        max-height: 300px;
        order: 2;
      }

      .canvas-wrapper {
        order: 1;
        flex: 1;
      }
    }

    @media (max-width: 768px) {
      .app-header h1 {
        font-size: 1.5rem;
      }

      .app-main {
        padding: 0.5rem;
      }

      .controls-sidebar {
        max-height: 250px;
      }

      .info-section {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback, forwardRef } = React;

    // ========== SHADER DEFINITIONS ==========
    const VERTEX_SHADER = `#version 300 es
precision highp float;
in vec2 a_position;
void main() {
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;

    const DOG_FRAGMENT = `#version 300 es
precision highp float;
uniform sampler2D u_image;
uniform float u_saturation;
uniform float u_brightness;
uniform float u_colorShift;
out vec4 outColor;
void main() {
  vec2 uv = gl_FragCoord.xy / vec2(1280.0, 720.0);
  uv.y = 1.0 - uv.y;
  vec4 color = texture(u_image, uv);
  float lum = dot(color.rgb, vec3(0.299, 0.587, 0.114));
  vec3 dogVision = mix(
    color.rgb,
    vec3(lum * (0.5 + u_colorShift * 0.3), lum * (0.5 + u_colorShift * 0.2), lum * (0.8 + u_colorShift * 0.2)),
    u_saturation
  );
  dogVision *= u_brightness;
  outColor = vec4(dogVision, 1.0);
}`;

    const CAT_FRAGMENT = `#version 300 es
precision highp float;
uniform sampler2D u_image;
uniform float u_saturation;
uniform float u_brightness;
uniform float u_colorShift;
out vec4 outColor;
void main() {
  vec2 uv = gl_FragCoord.xy / vec2(1280.0, 720.0);
  uv.y = 1.0 - uv.y;
  vec4 color = texture(u_image, uv);
  vec3 catVision = vec3(
    color.r * 0.4,
    color.g * (0.9 + u_colorShift * 0.2),
    color.b * (0.95 + u_colorShift * 0.15)
  );
  float lum = dot(catVision, vec3(0.299, 0.587, 0.114));
  catVision = mix(catVision, vec3(lum), 1.0 - u_saturation);
  catVision *= u_brightness;
  catVision = mix(catVision, vec3(pow(lum, 0.8)), 0.2);
  outColor = vec4(catVision, 1.0);
}`;

    const BIRD_FRAGMENT = `#version 300 es
precision highp float;
uniform sampler2D u_image;
uniform float u_saturation;
uniform float u_brightness;
uniform float u_uvSensitivity;
out vec4 outColor;
void main() {
  vec2 uv = gl_FragCoord.xy / vec2(1280.0, 720.0);
  uv.y = 1.0 - uv.y;
  vec4 color = texture(u_image, uv);
  vec3 birdVision = vec3(
    color.r * (0.6 + u_uvSensitivity * 0.2),
    color.g * 0.9,
    color.b * (1.1 + u_uvSensitivity * 0.3)
  );
  float uv_component = (color.b + color.r * 0.3) * u_uvSensitivity;
  birdVision += vec3(uv_component * 0.2, 0.0, uv_component * 0.4);
  float lum = dot(birdVision, vec3(0.299, 0.587, 0.114));
  birdVision = mix(vec3(lum), birdVision, u_saturation);
  birdVision *= u_brightness;
  birdVision += vec3(0.05 * sin(uv.x * 10.0));
  outColor = vec4(birdVision, 1.0);
}`;

    const BEE_FRAGMENT = `#version 300 es
precision highp float;
uniform sampler2D u_image;
uniform float u_saturation;
uniform float u_brightness;
uniform float u_uvSensitivity;
out vec4 outColor;
void main() {
  vec2 uv = gl_FragCoord.xy / vec2(1280.0, 720.0);
  uv.y = 1.0 - uv.y;
  vec4 color = texture(u_image, uv);
  float uv_value = (color.b + color.g * 0.5) * u_uvSensitivity;
  vec3 beeVision = vec3(
    uv_value * 0.8,
    color.g * (0.9 + u_uvSensitivity * 0.2),
    color.b * 1.1
  );
  vec2 pixelSize = vec2(8.0, 8.0);
  vec2 pixelCoord = floor(uv * pixelSize) / pixelSize;
  vec3 pixelated = texture(u_image, pixelCoord).rgb;
  float lum = dot(pixelated, vec3(0.299, 0.587, 0.114));
  beeVision = mix(beeVision, vec3(lum), 0.3);
  lum = dot(beeVision, vec3(0.299, 0.587, 0.114));
  beeVision = mix(vec3(lum), beeVision, u_saturation);
  beeVision *= u_brightness;
  float polarization = sin(pixelCoord.x * 10.0) * sin(pixelCoord.y * 10.0) * 0.1;
  beeVision += vec3(polarization);
  outColor = vec4(beeVision, 1.0);
}`;

    // ========== WEBGL UTILITIES ==========
    function compileShader(gl, source, type) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const info = gl.getShaderInfoLog(shader);
        gl.deleteShader(shader);
        throw new Error(`Shader compilation error: ${info}`);
      }
      return shader;
    }

    function createShaderProgram(gl, vertexSource, fragmentSource) {
      const vertexShader = compileShader(gl, vertexSource, gl.VERTEX_SHADER);
      const fragmentShader = compileShader(gl, fragmentSource, gl.FRAGMENT_SHADER);
      const program = gl.createProgram();
      gl.attachShader(program, vertexShader);
      gl.attachShader(program, fragmentShader);
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        const info = gl.getProgramInfoLog(program);
        gl.deleteProgram(program);
        throw new Error(`Program linking error: ${info}`);
      }
      gl.deleteShader(vertexShader);
      gl.deleteShader(fragmentShader);
      return program;
    }

    function renderFrame(gl, program, texture, parameters) {
      gl.useProgram(program);
      const positionBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      const positions = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
      gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
      const positionLocation = gl.getAttribLocation(program, 'a_position');
      gl.enableVertexAttribArray(positionLocation);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, texture);
      const samplerLocation = gl.getUniformLocation(program, 'u_image');
      gl.uniform1i(samplerLocation, 0);
      Object.keys(parameters).forEach(name => {
        const location = gl.getUniformLocation(program, `u_${name}`);
        if (location !== -1) {
          const value = parameters[name];
          if (typeof value === 'number') {
            gl.uniform1f(location, value);
          }
        }
      });
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      gl.deleteBuffer(positionBuffer);
    }

    // ========== VIDEO CAPTURE COMPONENT ==========
    const VideoCapture = forwardRef(({ mode, isActive, parameters, onFpsUpdate, onError }, ref) => {
      const canvasRef = useRef(null);
      const videoRef = useRef(null);
      const glRef = useRef(null);
      const programRef = useRef(null);
      const textureRef = useRef(null);
      const frameCountRef = useRef(0);
      const lastTimeRef = useRef(Date.now());
      const animationIdRef = useRef(null);

      const shaders = {
        dog: { vertexSource: VERTEX_SHADER, fragmentSource: DOG_FRAGMENT },
        cat: { vertexSource: VERTEX_SHADER, fragmentSource: CAT_FRAGMENT },
        bird: { vertexSource: VERTEX_SHADER, fragmentSource: BIRD_FRAGMENT },
        bee: { vertexSource: VERTEX_SHADER, fragmentSource: BEE_FRAGMENT },
      };

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        try {
          // Set default canvas size
          canvas.width = 1280;
          canvas.height = 720;

          const gl = canvas.getContext('webgl2', {
            antialias: false,
            alpha: false,
            powerPreference: 'high-performance',
          });
          if (!gl) throw new Error('WebGL 2.0 not supported');
          glRef.current = gl;
          gl.viewport(0, 0, canvas.width, canvas.height);
          gl.clearColor(0, 0, 0, 1);
          gl.clear(gl.COLOR_BUFFER_BIT);

          const shader = shaders[mode];
          const program = createShaderProgram(gl, shader.vertexSource, shader.fragmentSource);
          programRef.current = program;

          const texture = gl.createTexture();
          textureRef.current = texture;
          gl.bindTexture(gl.TEXTURE_2D, texture);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

          // Create a black placeholder texture
          const blackPixel = new Uint8Array([0, 0, 0]);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, 1, 1, 0, gl.RGB, gl.UNSIGNED_BYTE, blackPixel);
        } catch (err) {
          onError(`WebGL initialization failed: ${err.message}`);
        }
      }, [onError]);

      useEffect(() => {
        if (!glRef.current) return;
        try {
          const gl = glRef.current;
          const oldProgram = programRef.current;
          const shader = shaders[mode];
          const newProgram = createShaderProgram(gl, shader.vertexSource, shader.fragmentSource);
          programRef.current = newProgram;
          if (oldProgram) gl.deleteProgram(oldProgram);
        } catch (err) {
          onError(`Shader compilation failed: ${err.message}`);
        }
      }, [mode, onError]);

      useEffect(() => {
        const initCamera = async () => {
          try {
            if (!isActive) {
              if (videoRef.current?.srcObject) {
                videoRef.current.srcObject.getTracks().forEach(track => track.stop());
                videoRef.current.srcObject = null;
              }
              return;
            }
            const stream = await navigator.mediaDevices.getUserMedia({
              video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
              audio: false
            });
            if (videoRef.current) videoRef.current.srcObject = stream;
          } catch (err) {
            onError(`Camera access denied: ${err.message}`);
          }
        };
        initCamera();
        return () => {
          if (videoRef.current?.srcObject) {
            videoRef.current.srcObject.getTracks().forEach(track => track.stop());
          }
        };
      }, [isActive, onError]);

      const renderLoop = useCallback(() => {
        const canvas = canvasRef.current;
        const video = videoRef.current;
        const gl = glRef.current;
        const program = programRef.current;
        const texture = textureRef.current;
        if (!canvas || !gl || !program || !texture) {
          animationIdRef.current = requestAnimationFrame(renderLoop);
          return;
        }

        // Update canvas size if video is ready
        if (video && video.readyState === video.HAVE_ENOUGH_DATA) {
          if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);
          }
          gl.bindTexture(gl.TEXTURE_2D, texture);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, video);
        }

        // Always render (with video or placeholder)
        renderFrame(gl, program, texture, parameters);

        frameCountRef.current++;
        const now = Date.now();
        const elapsed = now - lastTimeRef.current;
        if (elapsed >= 1000) {
          const currentFps = Math.round((frameCountRef.current * 1000) / elapsed);
          onFpsUpdate(currentFps);
          frameCountRef.current = 0;
          lastTimeRef.current = now;
        }
        animationIdRef.current = requestAnimationFrame(renderLoop);
      }, [parameters, onFpsUpdate]);

      useEffect(() => {
        if (!isActive) {
          if (animationIdRef.current) cancelAnimationFrame(animationIdRef.current);
          animationIdRef.current = null;
          return;
        }
        // Start render loop immediately
        if (!animationIdRef.current) {
          animationIdRef.current = requestAnimationFrame(renderLoop);
        }
      }, [isActive, renderLoop]);

      return (
        <div style={{ position: 'relative', width: '100%', height: '100%' }}>
          <video ref={videoRef} autoPlay playsInline muted style={{ display: 'none' }} />
          <canvas ref={canvasRef} className="webgl-canvas" />
        </div>
      );
    });

    VideoCapture.displayName = 'VideoCapture';

    // ========== PERFORMANCE MONITOR COMPONENT ==========
    function PerformanceMonitor({ fps, mode }) {
      const [memory, setMemory] = useState(0);
      const [avgFps, setAvgFps] = useState(fps);
      const fpsHistoryRef = useRef([]);

      useEffect(() => {
        fpsHistoryRef.current.push(fps);
        if (fpsHistoryRef.current.length > 60) fpsHistoryRef.current.shift();
        const avg = Math.round(fpsHistoryRef.current.reduce((a, b) => a + b, 0) / fpsHistoryRef.current.length);
        setAvgFps(avg);
      }, [fps]);

      useEffect(() => {
        const updateMemory = () => {
          if (performance.memory) {
            const usedMemory = performance.memory.usedJSHeapSize / 1048576;
            setMemory(usedMemory.toFixed(1));
          }
        };
        const interval = setInterval(updateMemory, 1000);
        return () => clearInterval(interval);
      }, []);

      const fpsStatus = fps >= 30 ? 'good' : fps >= 20 ? 'fair' : 'poor';

      return (
        <div className="performance-monitor">
          <div className="monitor-header">
            <h3>Performance</h3>
            <span className={`status-indicator ${fpsStatus}`} />
          </div>
          <div className="monitor-stats">
            <div className="stat-row">
              <span className="stat-label">Current FPS</span>
              <span className="stat-value fps-value">{fps}</span>
            </div>
            <div className="stat-row">
              <span className="stat-label">Average FPS</span>
              <span className="stat-value">{avgFps}</span>
            </div>
            <div className="stat-row">
              <span className="stat-label">Frame Time</span>
              <span className="stat-value">{fps > 0 ? (1000 / fps).toFixed(1) : '—'}ms</span>
            </div>
            {memory > 0 && (
              <div className="stat-row">
                <span className="stat-label">Memory</span>
                <span className="stat-value">{memory}MB</span>
              </div>
            )}
            <div className="stat-row">
              <span className="stat-label">Shader Mode</span>
              <span className="stat-value mode-badge">{mode.toUpperCase()}</span>
            </div>
          </div>
          <div className="target-info">
            <p>🎯 Target: 30+ FPS (60 FPS optimal)</p>
            <div className="performance-bar">
              <div className="performance-fill" style={{ width: `${Math.min((fps / 60) * 100, 100)}%` }} />
            </div>
          </div>
        </div>
      );
    }

    // ========== CONTROL PANEL COMPONENT ==========
    function ControlPanel({ mode, onModeChange, parameters, onParameterChange, isActive, onToggle }) {
      const modes = [
        { id: 'dog', name: '🐕 Dog Vision', desc: 'Dichromatic - Blue/Yellow' },
        { id: 'cat', name: '🐱 Cat Vision', desc: 'Night Vision Enhanced' },
        { id: 'bird', name: '🐦 Bird Vision', desc: 'Tetrachromatic - UV Sensitive' },
        { id: 'bee', name: '🐝 Bee Vision', desc: 'Compound Eyes - UV Polarization' },
      ];

      const paramDefs = {
        dog: [
          { name: 'saturation', min: 0, max: 1, step: 0.05, label: 'Color Saturation' },
          { name: 'brightness', min: 0.5, max: 2, step: 0.1, label: 'Brightness' },
          { name: 'colorShift', min: 0, max: 1, step: 0.05, label: 'Color Shift' },
        ],
        cat: [
          { name: 'saturation', min: 0, max: 1, step: 0.05, label: 'Saturation' },
          { name: 'brightness', min: 0.5, max: 2.5, step: 0.1, label: 'Night Vision Boost' },
          { name: 'colorShift', min: 0, max: 1, step: 0.05, label: 'Green Channel' },
        ],
        bird: [
          { name: 'saturation', min: 0, max: 1.5, step: 0.05, label: 'Color Saturation' },
          { name: 'brightness', min: 0.5, max: 2, step: 0.1, label: 'Brightness' },
          { name: 'uvSensitivity', min: 0, max: 2, step: 0.1, label: 'UV Sensitivity' },
        ],
        bee: [
          { name: 'saturation', min: 0, max: 1, step: 0.05, label: 'Color Saturation' },
          { name: 'brightness', min: 0.5, max: 2, step: 0.1, label: 'Brightness' },
          { name: 'uvSensitivity', min: 0.5, max: 2, step: 0.1, label: 'UV Perception' },
        ],
      };

      const currentParams = paramDefs[mode] || [];

      return (
        <div className="control-panel">
          <div className="panel-section">
            <h3>Animal Vision Mode</h3>
            <div className="mode-buttons">
              {modes.map(animal => (
                <button
                  key={animal.id}
                  className={`mode-button ${mode === animal.id ? 'active' : ''}`}
                  onClick={() => onModeChange(animal.id)}
                  title={animal.desc}
                >
                  {animal.name}
                </button>
              ))}
            </div>
          </div>

          <div className="panel-section">
            <h3>Camera Control</h3>
            <button className={`toggle-button ${isActive ? 'active' : ''}`} onClick={onToggle}>
              {isActive ? '⏸ Stop Camera' : '▶ Start Camera'}
            </button>
          </div>

          <div className="panel-section">
            <h3>Vision Parameters</h3>
            <div className="parameters">
              {currentParams.map(param => (
                <div key={param.name} className="parameter-control">
                  <label className="parameter-label">{param.label}</label>
                  <div className="parameter-input-group">
                    <input
                      type="range"
                      min={param.min}
                      max={param.max}
                      step={param.step}
                      value={parameters[param.name]}
                      onChange={(e) => onParameterChange(param.name, parseFloat(e.target.value))}
                      className="parameter-slider"
                    />
                    <span className="parameter-value">{parameters[param.name].toFixed(2)}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div className="panel-section info-section">
            <h3>ℹ️ About {modes.find(m => m.id === mode)?.name}</h3>
            <p className="mode-description">
              {mode === 'dog' && 'Dogs see in dichromatic vision (blue-yellow). They have poor red perception but excellent motion detection and night vision.'}
              {mode === 'cat' && 'Cats have excellent night vision with 6x better light perception than humans. Superior motion detection with a narrower color range.'}
              {mode === 'bird' && 'Birds are tetrachromatic, seeing UV light invisible to humans. They have the sharpest vision of all animals and can see fine details at great distances.'}
              {mode === 'bee' && 'Bees see in ultraviolet, blue, and green - not red. They perceive polarized light and have compound eyes.'}
            </p>
          </div>
        </div>
      );
    }

    // ========== MAIN APP COMPONENT ==========
    function App() {
      const canvasRef = useRef(null);
      const [mode, setMode] = useState('dog');
      const [isActive, setIsActive] = useState(false);
      const [fps, setFps] = useState(0);
      const [parameters, setParameters] = useState({
        dog: { saturation: 0.3, brightness: 1.2, colorShift: 0.8 },
        cat: { saturation: 0.6, brightness: 1.5, colorShift: 0.6 },
        bird: { saturation: 1.0, brightness: 1.3, uvSensitivity: 1.2 },
        bee: { saturation: 0.8, brightness: 1.1, uvSensitivity: 1.5 },
      });
      const [error, setError] = useState(null);

      return (
        <div className="app-container">
          <header className="app-header">
            <h1>🐾 Animal Vision WebGL Simulator</h1>
            <p>Experience the world through different animal eyes</p>
          </header>

          <main className="app-main">
            <div className="canvas-wrapper">
              <VideoCapture
                ref={canvasRef}
                mode={mode}
                isActive={isActive}
                parameters={parameters[mode]}
                onFpsUpdate={setFps}
                onError={setError}
              />
              {error && (
                <div className="error-banner">
                  <span>{error}</span>
                  <button onClick={() => setError(null)}>✕</button>
                </div>
              )}
            </div>

            <aside className="controls-sidebar">
              <PerformanceMonitor fps={fps} mode={mode} />

              <ControlPanel
                mode={mode}
                onModeChange={setMode}
                parameters={parameters[mode]}
                onParameterChange={(param, value) => {
                  setParameters(prev => ({
                    ...prev,
                    [mode]: { ...prev[mode], [param]: value }
                  }));
                }}
                isActive={isActive}
                onToggle={() => setIsActive(!isActive)}
              />
            </aside>
          </main>

          <footer className="app-footer">
            <p>WebGL 2.0 • GPU-Accelerated • Real-time Filtering</p>
          </footer>
        </div>
      );
    }

    // ========== RENDER APP ==========
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
