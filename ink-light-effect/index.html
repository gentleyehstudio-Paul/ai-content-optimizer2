<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水墨光紋 Ink Light Flow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2em;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 0.9em;
            color: #888;
            line-height: 1.6;
        }

        .mode-tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .mode-tab {
            padding: 12px 24px;
            background: transparent;
            border: 2px solid #555;
            color: #aaa;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            border-radius: 4px;
        }

        .mode-tab:hover {
            border-color: #fff;

        }

        .mode-tab.active {
            border-color: #fff;
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .mode-content {
            display: none;
        }

        .mode-content.active {
            display: block;
        }

        .camera-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .canvas-wrapper {
            flex: 1;
            min-width: 300px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        video {
            display: none;
        }

        .controls {
            flex: 0 0 300px;
            display: flex;
            flex-direction: column;

        }

        .control-group {

        .control-label {

        }

        .control-value {
            font-size: 1.2em;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            background: #ddd;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        input[type="range"]::-moz-range-thumb:hover {
            background: #ddd;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        select {
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
            font-size: 0.9em;
            cursor: pointer;
        }

        select:hover {
            border-color: #555;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 12px 20px;
            background: transparent;
            border: 2px solid #555;
            color: #fff;
            cursor: pointer;
            font-size: 0.95em;
            border-radius: 4px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        button:hover:not(:disabled) {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.primary {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        button.primary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
        }

        .video-info {
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            border-radius: 4px;
            font-size: 0.9em;
            color: #aaa;
            text-align: center;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-container {
            display: none;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            border-radius: 4px;
        }

        .progress-container.active {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: #fff;
            width: 0%;
            transition: width 0.2s ease;
        }

        .progress-text {
            font-size: 0.9em;
            color: #aaa;
            text-align: center;
        }

        input[type="file"] {
            display: none;
        }

        .file-input-label {
            padding: 12px 20px;
            background: transparent;
            border: 2px solid #555;
            color: #fff;
            cursor: pointer;
            font-size: 0.95em;
            border-radius: 4px;
            text-align: center;
            transition: all 0.3s ease;
            display: block;
        }

        .file-input-label:hover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .video-only-mode {
            display: flex;
            flex-direction: column;
            gap: 30px;
            align-items: center;
        }

        .video-info-large {
            text-align: center;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #333;
            border-radius: 4px;
            min-width: 300px;
        }

        @media (max-width: 768px) {
            .camera-container {
                flex-direction: column;
            }

            .controls {
                flex: 1;
            }

            .header h1 {
                font-size: 1.5em;
            }

            .mode-tabs {
                flex-direction: column;
                gap: 10px;
            }

            .mode-tab {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>水墨光紋 · INK LIGHT FLOW</h1>
            <p>本程式使用開放式演算模型（非固定黑箱），即時分析鏡頭畫面或影片的<br>明暗梯度與動變化，將其轉換流動的水墨光紋筆觸。需要攝影機權限，且須在 HTTPS 或 localhost 環境下執行。</p>
        </div>

        <div class="mode-tabs">
            <button class="mode-tab active" data-mode="camera">📷 即時鏡頭 Camera</button>
            <button class="mode-tab" data-mode="video">🎬 影片處理 Video</button>
        </div>

        <!-- Camera Mode -->
        <div class="mode-content active" id="camera-mode">
            <div class="camera-container">
                <div class="canvas-wrapper">
                    <canvas id="canvas"></canvas>
                </div>

                <div class="controls">
                    <div class="control-group">
                        <label class="control-label">敏感度 Sensitivity</label>
                        <input type="range" id="sensitivity" min="2" max="40" value="14">
                        <div class="control-value"><span id="sensitivityValue">14</span></div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">墨韻延遲 Ink Flow</label>
                        <input type="range" id="delay" min="2" max="30" value="9">
                        <div class="control-value"><span id="delayValue">9</span></div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">筆觸長度 Stroke Length</label>
                        <input type="range" id="strokeLength" min="4" max="60" value="26">
                        <div class="control-value"><span id="strokeLengthValue">26</span></div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">粒子密度 Particle Density</label>
                        <input type="range" id="particleDensity" min="1" max="10" value="5">
                        <div class="control-value"><span id="particleDensityValue">5</span></div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">主題 Theme</label>
                        <select id="theme">
                            <option value="dark">墨夜光紋</option>
                            <option value="paper">宣紙水墨</option>
                            <option value="aurora">極光水墨</option>
                        </select>
                    </div>

                    <div class="button-group">
                        <button id="startCamera" class="primary">▶ 啟動鏡頭 Start Camera</button>
                        <button id="switchCamera" style="display:none;">↔ 切換相機 Switch Camera</button>
                        <button id="recordBtn" style="display:none;">● 開始錄影 Start Recording</button>
                        <button id="stopBtn" style="display:none;">⏹ 停止 Stop</button>
                        <button id="downloadBtn" style="display:none;">💾 儲存 / 分享影片 Save / Share</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Video Mode -->
        <div class="mode-content" id="video-mode">
            <div class="video-only-mode">
                <div class="video-info-large">
                    <p style="margin-bottom: 20px;">📁 選擇影片 Select Video</p>
                    <label class="file-input-label" for="videoFileInput">📁 選擇影片 Select Video</label>
                    <input type="file" id="videoFileInput" accept="video/*">
                    <div id="videoInfo" class="video-info" style="margin-top: 20px;">0×0 · 0s</div>
                </div>

                <div class="controls" style="flex: 1; min-width: 300px;">
                    <div class="control-group">
                        <label class="control-label">敏感度 Sensitivity</label>
                        <input type="range" id="videoSensitivity" min="2" max="40" value="14">
                        <div class="control-value"><span id="videoSensitivityValue">14</span></div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">墨韻延遲 Ink Flow</label>
                        <input type="range" id="videoDelay" min="2" max="30" value="9">
                        <div class="control-value"><span id="videoDelayValue">9</span></div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">筆觸長度 Stroke Length</label>
                        <input type="range" id="videoStrokeLength" min="4" max="60" value="26">
                        <div class="control-value"><span id="videoStrokeLengthValue">26</span></div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">粒子密度 Particle Density</label>
                        <input type="range" id="videoParticleDensity" min="1" max="10" value="5">
                        <div class="control-value"><span id="videoParticleDensityValue">5</span></div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">主題 Theme</label>
                        <select id="videoTheme">
                            <option value="dark">墨夜光紋</option>
                            <option value="paper">宣紙水墨</option>
                            <option value="aurora">極光水墨</option>
                        </select>
                    </div>

                    <div class="button-group">
                        <button id="processVideoBtn" class="primary">⚙️ 開始處理 Start Processing</button>
                        <button id="cancelVideoBtn" style="display:none;">✕ 取消 Cancel</button>
                        <button id="downloadVideoBtn" style="display:none;">💾 儲存 / 分享影片 Save / Share</button>
                    </div>

                    <div id="progressContainer" class="progress-container">
                        <div class="progress-bar">
                            <div id="progressFill" class="progress-fill"></div>
                        </div>
                        <div class="progress-text">
                            <span id="progressText">0 / 0 frames (0%)</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <video id="video"></video>
    <video id="videoSource"></video>

    <script>
        // Stroke class
        class Stroke {
            constructor(x, y, angle, length, color, opacity = 1.0) {
                this.x = x;
                this.y = y;
                this.angle = angle;
                this.length = length;
                this.color = color;
                this.opacity = opacity;
                this.maxOpacity = opacity;
                this.decayRate = 0.95;
            }

            update() {
                this.opacity *= this.decayRate;
            }

            draw(ctx) {
                if (this.opacity < 0.01) return;

                const x1 = this.x;
                const y1 = this.y;
                const x2 = this.x + Math.cos(this.angle) * this.length;
                const y2 = this.y + Math.sin(this.angle) * this.length;

                ctx.strokeStyle = this.color.replace(')', `, ${this.opacity})`).replace('rgb', 'rgba');
                ctx.lineWidth = 1.5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }

            isAlive() {
                return this.opacity > 0.01;
            }
        }

        // Global state
        let canvas = document.getElementById('canvas');
        let ctx = canvas.getContext('2d');
        let video = document.getElementById('video');
        let videoSource = document.getElementById('videoSource');

        let strokes = [];
        let prevFrame = null;

        let sensitivity = 14;
        let delayFactor = 9;
        let strokeLength = 26;
        let particleDensity = 5;
        let theme = 'dark';

        let isRecording = false;
        let mediaRecorder = null;
        let recordedChunks = [];
        let cameraActive = false;
        let currentMode = 'camera';
        let facingMode = 'user';

        let processingCancelled = false;
        let isProcessing = false;
        let processedVideoBlob = null;

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }

        function getThemeColors() {
            switch (theme) {
                case 'paper':
                    return { strokeColor: 'rgb(60, 40, 20)', glowColor: 'rgba(200, 180, 140, 0.6)' };
                case 'aurora':
                    return { strokeColor: 'rgb(100, 200, 255)', glowColor: 'rgba(100, 200, 255, 0.4)' };
                default:
                    return { strokeColor: 'rgb(200, 220, 255)', glowColor: 'rgba(200, 220, 255, 0.5)' };
            }
        }

        function analyzeAndSpawn(frame, width, height) {
            const data = frame.data;
            const newStrokes = [];

            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    const idx = (y * width + x) * 4;

                    const gx = -data[(y - 1) * width * 4 + (x - 1) * 4] - 2 * data[(y) * width * 4 + (x - 1) * 4] - data[(y + 1) * width * 4 + (x - 1) * 4]
                        + data[(y - 1) * width * 4 + (x + 1) * 4] + 2 * data[(y) * width * 4 + (x + 1) * 4] + data[(y + 1) * width * 4 + (x + 1) * 4];

                    const gy = data[(y - 1) * width * 4 + (x - 1) * 4] + 2 * data[(y - 1) * width * 4 + x * 4] + data[(y - 1) * width * 4 + (x + 1) * 4]
                        - data[(y + 1) * width * 4 + (x - 1) * 4] - 2 * data[(y + 1) * width * 4 + x * 4] - data[(y + 1) * width * 4 + (x + 1) * 4];

                    const magnitude = Math.sqrt(gx * gx + gy * gy);

                    if (magnitude > sensitivity * 30) {
                        const angle = Math.atan2(gy, gx) + Math.PI / 2;
                        const density = Math.min(particleDensity, Math.floor(magnitude / (sensitivity * 50)));

                        const { strokeColor } = getThemeColors();

                        for (let i = 0; i < density; i++) {
                            const offsetX = (Math.random() - 0.5) * 2;
                            const offsetY = (Math.random() - 0.5) * 2;
                            newStrokes.push(new Stroke(
                                x + offsetX,
                                y + offsetY,
                                angle + (Math.random() - 0.5) * 0.3,
                                strokeLength,
                                strokeColor,
                                0.8
                            ));
                        }
                    }
                }
            }

            return newStrokes;
        }

        function loop() {
            if (!cameraActive && currentMode === 'camera') return;

            const source = currentMode === 'camera' ? video : videoSource;

            if (source.readyState === source.HAVE_ENOUGH_DATA) {
                const sampleCanvas = document.createElement('canvas');
                sampleCanvas.width = 96;
                sampleCanvas.height = 54;
                const sampleCtx = sampleCanvas.getContext('2d');

                sampleCtx.drawImage(source, 0, 0, 96, 54);
                const frame = sampleCtx.getImageData(0, 0, 96, 54);

                if (prevFrame) {
                    const newStrokes = analyzeAndSpawn(frame, 96, 54);
                    strokes = strokes.concat(newStrokes).filter(s => s.isAlive());
                    strokes.forEach(s => s.update());
                }

                prevFrame = frame;

                const { glowColor } = getThemeColors();
                if (theme === 'paper') {
                    ctx.fillStyle = 'rgba(240, 235, 220, 0.1)';
                } else if (theme === 'aurora') {
                    ctx.fillStyle = 'rgba(20, 20, 40, 0.1)';
                } else {
                    ctx.fillStyle = 'rgba(10, 10, 20, 0.1)';
                }
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const scaleX = canvas.width / 96;
                const scaleY = canvas.height / 54;

                ctx.save();
                if (theme === 'paper') {
                    ctx.globalCompositeOperation = 'multiply';
                } else {
                    ctx.globalCompositeOperation = 'lighter';
                }

                ctx.scale(scaleX, scaleY);
                strokes.forEach(stroke => stroke.draw(ctx));
                ctx.restore();
            }

            requestAnimationFrame(loop);
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode }
                });

                video.srcObject = stream;
                cameraActive = true;
                currentMode = 'camera';

                resizeCanvas();
                document.getElementById('startCamera').style.display = 'none';
                document.getElementById('switchCamera').style.display = 'block';
                document.getElementById('recordBtn').style.display = 'block';

                loop();
            } catch (err) {
                console.error('Camera access denied:', err);
                if (facingMode === 'user') {
                    facingMode = 'environment';
                    startCamera();
                }
            }
        }

        document.getElementById('videoFileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                videoSource.src = url;
                videoSource.load();

                const updateInfo = () => {
                    if (videoSource.videoWidth && videoSource.videoHeight && videoSource.duration) {
                        document.getElementById('videoInfo').textContent =
                            `${videoSource.videoWidth}×${videoSource.videoHeight} · ${Math.round(videoSource.duration)}s`;
                    }
                };

                videoSource.addEventListener('loadedmetadata', updateInfo);
                videoSource.addEventListener('canplay', updateInfo);
            }
        });

        function pickMimeType() {
            const types = ['video/mp4', 'video/webm'];
            for (const type of types) {
                if (MediaRecorder.isTypeSupported(type)) return type;
            }
            return 'video/mp4';
        }

        function calculateBitrate(width, height) {
            const pixelCount = width * height;
            const baseBitrate = pixelCount * 0.1;
            return Math.min(40000000, Math.max(6000000, baseBitrate));
        }

        function downloadVideo(blob) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ink-light-flow-${Date.now()}.${blob.type.includes('mp4') ? 'mp4' : 'webm'}`;

            if (navigator.share && navigator.canShare({ files: [new File([blob], a.download)] })) {
                navigator.share({ files: [new File([blob], a.download)] });
            } else {
                a.click();
            }

            URL.revokeObjectURL(url);
        }

        async function processVideo() {
            if (!videoSource.src || videoSource.videoWidth === 0 || videoSource.videoHeight === 0) {
                alert('請先選擇有效的影片檔案');
                return;
            }

            isProcessing = true;
            processingCancelled = false;
            processedVideoBlob = null;
            recordedChunks = [];

            const progressContainer = document.getElementById('progressContainer');
            progressContainer.classList.add('active');

            document.getElementById('processVideoBtn').style.display = 'none';
            document.getElementById('cancelVideoBtn').style.display = 'block';

            return new Promise((resolve) => {
                const processStart = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = videoSource.videoWidth;
                        canvas.height = videoSource.videoHeight;
                        const ctx = canvas.getContext('2d');

                        const stream = canvas.captureStream(30);
                        const mimeType = pickMimeType();
                        const recorder = new MediaRecorder(stream, {
                            mimeType: mimeType,
                            videoBitsPerSecond: calculateBitrate(canvas.width, canvas.height)
                        });

                        recorder.ondataavailable = (e) => {
                            if (e.data.size > 0) recordedChunks.push(e.data);
                        };

                        recorder.onstop = () => {
                            processedVideoBlob = new Blob(recordedChunks, { type: mimeType });
                            recordedChunks = [];
                            isProcessing = false;
                            progressContainer.classList.remove('active');
                            document.getElementById('processVideoBtn').style.display = 'none';
                            document.getElementById('downloadVideoBtn').style.display = 'block';
                            document.getElementById('cancelVideoBtn').style.display = 'none';
                            resolve(processedVideoBlob);
                        };

                        recorder.start();
                        videoSource.currentTime = 0;

                        const fps = 30;
                        const totalFrames = Math.ceil(videoSource.duration * fps);
                        let currentFrame = 0;
                        let prevFrameData = null;
                        let processingStrokes = [];

                        const processFrame = () => {
                            if (processingCancelled || currentFrame >= totalFrames) {
                                if (processingCancelled) {
                                    recorder.stop();
                                    isProcessing = false;
                                    progressContainer.classList.remove('active');
                                    document.getElementById('processVideoBtn').style.display = 'block';
                                    document.getElementById('cancelVideoBtn').style.display = 'none';
                                    resolve(null);
                                } else {
                                    recorder.stop();
                                }
                                return;
                            }

                            videoSource.currentTime = currentFrame / fps;
                        };

                        videoSource.onseeked = () => {
                            try {
                                ctx.drawImage(videoSource, 0, 0);

                                const sampleCanvas = document.createElement('canvas');
                                sampleCanvas.width = 96;
                                sampleCanvas.height = 54;
                                const sampleCtx = sampleCanvas.getContext('2d');
                                sampleCtx.drawImage(videoSource, 0, 0, 96, 54);
                                const frame = sampleCtx.getImageData(0, 0, 96, 54);

                                if (theme === 'paper') {
                                    ctx.fillStyle = 'rgba(240, 235, 220, 0.05)';
                                } else if (theme === 'aurora') {
                                    ctx.fillStyle = 'rgba(20, 20, 40, 0.05)';
                                } else {
                                    ctx.fillStyle = 'rgba(10, 10, 20, 0.05)';
                                }
                                ctx.fillRect(0, 0, canvas.width, canvas.height);

                                if (prevFrameData) {
                                    const newStrokes = analyzeAndSpawn(frame, 96, 54);
                                    processingStrokes = processingStrokes.concat(newStrokes).filter(s => s.isAlive());
                                    processingStrokes.forEach(s => s.update());
                                }

                                prevFrameData = frame;

                                const scaleX = canvas.width / 96;
                                const scaleY = canvas.height / 54;

                                ctx.save();
                                if (theme === 'paper') {
                                    ctx.globalCompositeOperation = 'multiply';
                                } else {
                                    ctx.globalCompositeOperation = 'lighter';
                                }
                                ctx.scale(scaleX, scaleY);
                                processingStrokes.forEach(stroke => stroke.draw(ctx));
                                ctx.restore();

                                currentFrame++;
                                const progress = (currentFrame / totalFrames) * 100;
                                document.getElementById('progressFill').style.width = progress + '%';
                                document.getElementById('progressText').textContent =
                                    `${currentFrame} / ${totalFrames} frames (${Math.round(progress)}%)`;

                                setTimeout(processFrame, 5);
                            } catch (err) {
                                console.error('Frame error:', err);
                                setTimeout(processFrame, 5);
                            }
                        };

                        processFrame();
                    } catch (err) {
                        console.error('Setup error:', err);
                        alert('處理失敗: ' + err.message);
                        isProcessing = false;
                        progressContainer.classList.remove('active');
                        document.getElementById('processVideoBtn').style.display = 'block';
                        document.getElementById('cancelVideoBtn').style.display = 'none';
                        resolve(null);
                    }
                };

                if (videoSource.readyState >= 2) {
                    processStart();
                } else {
                    videoSource.addEventListener('canplay', processStart, { once: true });
                }
            });
        }

        // Event listeners
        document.getElementById('startCamera').addEventListener('click', startCamera);

        document.getElementById('switchCamera').addEventListener('click', () => {
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            video.srcObject.getTracks().forEach(track => track.stop());
            startCamera();
        });

        document.getElementById('recordBtn').addEventListener('click', () => {
            recordedChunks = [];
            const stream = canvas.captureStream(30);
            mediaRecorder = new MediaRecorder(stream, { mimeType: pickMimeType() });

            mediaRecorder.ondataavailable = (e) => {
                recordedChunks.push(e.data);
            };

            mediaRecorder.start();
            isRecording = true;
            document.getElementById('recordBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'block';
        });

        document.getElementById('stopBtn').addEventListener('click', () => {
            mediaRecorder.stop();
            isRecording = false;
            document.getElementById('recordBtn').style.display = 'block';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('downloadBtn').style.display = 'block';
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
            downloadVideo(blob);
            recordedChunks = [];
            document.getElementById('downloadBtn').style.display = 'none';
            document.getElementById('recordBtn').style.display = 'block';
        });

        document.getElementById('processVideoBtn').addEventListener('click', async () => {
            await processVideo();
        });

        document.getElementById('cancelVideoBtn').addEventListener('click', () => {
            processingCancelled = true;
        });

        document.getElementById('downloadVideoBtn').addEventListener('click', () => {
            if (processedVideoBlob) {
                downloadVideo(processedVideoBlob);
                processedVideoBlob = null;
                document.getElementById('downloadVideoBtn').style.display = 'none';
                document.getElementById('processVideoBtn').style.display = 'block';
            }
        });

        ['sensitivity', 'delay', 'strokeLength', 'particleDensity', 'theme'].forEach(param => {
            const elem = document.getElementById(param);
            if (elem) {
                elem.addEventListener('input', (e) => {
                    const value = e.target.value;
                    eval(`${param} = ${isNaN(value) ? `'${value}'` : value}`);
                    document.getElementById(`${param}Value`).textContent = value;
                });
            }
        });

        ['videoSensitivity', 'videoDelay', 'videoStrokeLength', 'videoParticleDensity', 'videoTheme'].forEach(param => {
            const elem = document.getElementById(param);
            if (elem) {
                elem.addEventListener('input', (e) => {
                    const baseParam = param.replace('video', '').toLowerCase();
                    const value = e.target.value;
                    eval(`${baseParam} = ${isNaN(value) ? `'${value}'` : value}`);
                    document.getElementById(`${param}Value`).textContent = value;
                });
            }
        });

        document.querySelectorAll('.mode-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const mode = tab.dataset.mode;
                currentMode = mode;

                document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                document.querySelectorAll('.mode-content').forEach(content => content.classList.remove('active'));
                document.getElementById(`${mode}-mode`).classList.add('active');
            });
        });

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
    </script>
</body>
</html>
