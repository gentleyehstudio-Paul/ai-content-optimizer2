<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Experience the world through the eyes of different animals using WebGL 2.0" />

  <title>🐾 Animal Vision WebGL Simulator</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0f172a;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    #root {
      width: 100%;
      height: 100%;
      display: flex;
    }

    /* Fallback for non-JS */
    noscript {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: #1e293b;
      color: #cbd5e1;
      font-size: 1.125rem;
      text-align: center;
      padding: 2rem;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <noscript>
    <div>
      <h1>🐾 Animal Vision Simulator</h1>
      <p>This application requires JavaScript to be enabled.</p>
      <p>Please enable JavaScript in your browser settings and reload the page.</p>
    </div>
  </noscript>
  <script type="module" src="/src/index.jsx"></script>
</body>
</html>
